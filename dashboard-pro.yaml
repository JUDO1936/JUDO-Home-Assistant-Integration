# PRO-/PRO-L-Dashboard; Beispiel-Gerätename: i-soft PRO Keller.
# VOR DEM IMPORT ANPASSEN:
# 1. Einstellungen > Geräte & Dienste > JUDO > dein Gerät > Entitäten öffnen.
# 2. Die vollständigen Entity-IDs deiner Anlage kopieren.
# 3. Den Beispielpräfix judo_i_soft_PRO unten durch
#    den Präfix deiner Anlage ersetzen. Beispiel-Port 8080: am Präfix steht dann
#    zusätzlich _p8080.
# Die Entity-IDs richten sich nach IP-Adresse/Hostname und Port, nicht nach dem
# frei gewählten Gerätenamen. Bei manuell geänderten IDs jede ID einzeln ersetzen.
# Karten-Namen wie „Salzgewicht“ oder „Szene auswählen“ sind nur Anzeigenamen.
# Passe title und path an deinen Gerätenamen an, zum Beispiel „i-soft PRO PP1“.
views:
- title: i-soft PRO Beispielgerät
  path: judo-pro-beispiel
  icon: mdi:water-softener
  type: sections
  max_columns: 3
  dense_section_placement: false
  top_margin: false
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Anlage & Infodaten
      heading_style: title
      icon: mdi:information-outline
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.judo_i_soft_PRO_geratestatus
        name: Verbindungsstatus
        icon: mdi:lan-connect
      - entity: sensor.judo_i_soft_PRO_geratetyp
        name: Modelltyp
        icon: mdi:chip
      - entity: sensor.judo_i_soft_PRO_software_version
        name: Firmware-Version
        icon: mdi:numeric
    - type: heading
      heading: Verlauf (7-Tage)
      heading_style: title
      icon: mdi:chart-line
    - type: history-graph
      entities:
      - entity: sensor.judo_i_soft_PRO_gesamtwassermenge
        name: Gesamtwasser
      - entity: sensor.judo_i_soft_PRO_weichwassermenge
        name: Weichwasser
      - entity: sensor.judo_i_soft_PRO_aktueller_wasserdurchfluss
        name: Durchfluss
      - entity: sensor.judo_i_soft_PRO_wassertemperatur
        name: Temperatur
      hours_to_show: 168
      show_names: true
      logarithmic_scale: false
      expand_legend: false
  - type: grid
    cards:
    - type: heading
      heading: Wasser & Verbrauch
      heading_style: title
      icon: mdi:water
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.judo_i_soft_PRO_gesamtwassermenge
        name: Gesamtwassermenge
        icon: mdi:water
      - entity: sensor.judo_i_soft_PRO_weichwassermenge
        name: Weichwassermenge
        icon: mdi:water-outline
      - type: section
      - entity: sensor.judo_i_soft_PRO_wasserdurchfluss
        name: Aktueller Durchfluss
        icon: mdi:water-pump
      - entity: sensor.judo_i_soft_PRO_wassertemperatur
        name: Wassertemperatur
        icon: mdi:thermometer-water
    - type: heading
      heading: Leckageschutz & Ventile
      heading_style: title
      icon: mdi:shield-water
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.judo_i_soft_PRO_globaler_leckageschutz
        name: Leckageschutz-Status
        icon: mdi:shield-check
      - entity: sensor.judo_i_soft_PRO_leckageschutz_position_abgeleitet
        name: Leckageschutz Ventil
        icon: mdi:valve
      - entity: sensor.judo_i_soft_PRO_leckagegrund
        name: Leckagegrund
        icon: mdi:alert-decagram-outline
      - type: section
      - entity: select.judo_i_soft_PRO_entnahmedauer
        name: Max. Entnahmedauer
        icon: mdi:timer-cog
      - entity: number.judo_i_soft_PRO_entnahmemenge
        name: Max. Entnahmemenge
        icon: mdi:water-minus
      - entity: number.judo_i_soft_PRO_volumenstrom
        name: Max. Volumenstrom
        icon: mdi:speedometer
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: button.judo_i_soft_PRO_leckageschutz_schliessen
        name: Leckageschutz schließen
        icon: mdi:valve-closed
        hide_state: true
        features:
        - type: button
          action_name: Schließen
      - type: tile
        entity: button.judo_i_soft_PRO_leckageschutz_offnen
        name: Leckageschutz öffnen
        icon: mdi:valve-open
        hide_state: true
        features:
        - type: button
          action_name: Öffnen
    - type: heading
      heading: Salzvorrat & Warnung
      heading_style: title
      icon: mdi:salt-shaker
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.judo_i_soft_PRO_salzgewicht
        name: Aktuelles Salzgewicht
        icon: mdi:sack
      - entity: sensor.judo_i_soft_PRO_salzreichweite
        name: Verbleibende Reichweite
        icon: mdi:calendar-clock
      - type: section
      - entity: number.judo_i_soft_PRO_salzmangel_warnschwelle
        name: Warnschwelle (Tage)
        icon: mdi:alert-circle-outline
  - type: grid
    cards:
    - type: heading
      heading: Wasserhärte & Szenen
      heading_style: title
      icon: mdi:tune-vertical
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.judo_i_soft_PRO_wunschwasserharte
        name: Wunsch-Wasserhärte
        icon: mdi:water-opacity
      - entity: number.judo_i_soft_PRO_wunschwasserharte
        name: Aktuelle Wunsch-Wasserhärte
        icon: mdi:water-check-outline
      - entity: select.judo_i_soft_PRO_harteeinheit
        name: Einheiten-Auswahl
        icon: mdi:format-letter-case
      - type: section
      - entity: sensor.judo_i_soft_PRO_aktive_szene
        name: Aktive Szene
        icon: mdi:play-circle-outline
      - entity: select.judo_i_soft_PRO_szenenauswahl
        name: Szene auswählen
        icon: mdi:palette-outline
      - entity: select.judo_i_soft_PRO_szenendauer
        name: Szenendauer
        icon: mdi:timer-outline
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: button.judo_i_soft_PRO_szene_aktivieren
        name: Szene starten
        icon: mdi:play-circle
        hide_state: true
        features:
        - type: button
          action_name: Starten
      - type: tile
        entity: button.judo_i_soft_PRO_alltag_meistern
        name: Alltag meistern
        icon: mdi:home-water-outline
        hide_state: true
        features:
        - type: button
          action_name: Zurücksetzen
      - type: tile
        entity: button.judo_i_soft_PRO_regeneration_starten
        name: Regeneration
        icon: mdi:autorenew
        hide_state: true
        features:
        - type: button
          action_name: Starten
    - type: heading
      heading: Urlaubsmodus
      heading_style: title
      icon: mdi:beach
    - type: entities
      show_header_toggle: false
      entities:
      - entity: number.judo_i_soft_PRO_urlaubstage
        name: Urlaubstage festlegen
        icon: mdi:calendar-range
    - type: tile
      entity: button.judo_i_soft_PRO_urlaubsmodus_starten
      name: Urlaubsmodus aktivieren
      icon: mdi:beach
      hide_state: true
      features:
      - type: button
        action_name: Aktivieren
      grid_options:
        rows: 2
        columns: 12
